# Publishes the StoryKit editor from its source of truth
# (rsnyder/storykit-starter) to this repo's GitHub Pages.
# See storykit-starter/docs/editor-central.md.
name: deploy
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"   # daily safety net; main trigger is manual/API
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the transition page
        uses: actions/checkout@v4
        with:
          path: deploy

      - name: Check out the previous editor for local draft recovery
        uses: actions/checkout@v4
        with:
          repository: rsnyder/storykit-starter
          ref: 1d9256c18a13abc7419a40669ba4d4286d389c7e
          path: previous

      - name: Assemble the transition and recovery artifact
        run: |
          mkdir -p site/legacy/assets/js
          cp deploy/transition/* site/
          cp previous/editor/* site/legacy/
          cp previous/assets/js/skrender.js site/legacy/assets/js/skrender.js
          echo "Production: https://storykit-editor.ron-f9a.workers.dev/editor/" > site/SOURCE.txt
          echo "Recovery editor: rsnyder/storykit-starter@1d9256c18a13abc7419a40669ba4d4286d389c7e" >> site/SOURCE.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
